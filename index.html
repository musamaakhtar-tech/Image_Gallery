<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Image Gallery</h1>
        <button id="toggle-theme">🌙</button>
    </header>

    <div class="gallery-container">
        <div class="gallery">
            <div class="gallery-item" data-index="0">
                <img src="images/1.jpg" alt="Image 1">
                <div class="overlay">Beautiful View</div>
            </div>
            <div class="gallery-item" data-index="1">
                <img src="images/2.jpg" alt="Image 2">
                <div class="overlay">Nature Scene</div>
            </div>
            <div class="gallery-item" data-index="2">
                <img src="images/3.jpg" alt="Image 3">
                <div class="overlay">Mountain Peak</div>
            </div>
            <div class="gallery-item" data-index="3">
                <img src="images/4.jpg" alt="Image 4">
                <div class="overlay">Ocean Waves</div>
            </div>
            <div class="gallery-item" data-index="4">
                <img src="images/5.jpg" alt="Image 5">
                <div class="overlay">Forest Path</div>
            </div>
            <div class="gallery-item" data-index="5">
                <img src="images/6.jpg" alt="Image 6">
                <div class="overlay">Sunset Glow</div>
            </div>
            <div class="gallery-item" data-index="6">
                <img src="images/7.jpg" alt="Image 7">
                <div class="overlay">City Lights</div>
            </div>
            <div class="gallery-item" data-index="7">
                <img src="images/8.jpg" alt="Image 8">
                <div class="overlay">Desert Dunes</div>
            </div>
            <div class="gallery-item" data-index="8">
                <img src="images/9.jpg" alt="Image 9">
                <div class="overlay">Starry Night</div>
            </div>
        </div>
    </div>

    <div class="full-img" id="fullImgBox">
        <span onclick="closeFullImg()">&times;</span>
        <button class="nav-btn" id="prevBtn" onclick="navigateImage(-1)">&#10094;</button>
        <img src="" id="fullImg">
        <button class="nav-btn" id="nextBtn" onclick="navigateImage(1)">&#10095;</button>
    </div>

    <footer>
        <p>&copy; <span id="currentYear"></span> Image Gallery. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
